name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe your idea below.
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would you like to see added or changed?
      placeholder: Clear description of the feature...
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Motivation
      description: Why would this be useful? What problem does it solve?
      placeholder: Explain the use case...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (optional)
      description: Any alternative solutions or workarounds you've tried?
      placeholder: N/A
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context (optional)
      description: Screenshots, mockups, or related issues
      placeholder: N/A
    validations:
      required: false